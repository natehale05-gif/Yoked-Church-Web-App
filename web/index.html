<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    One static file serves every church, so everything here is the
    *product* rather than any one congregation. A church's own name,
    colour, description and icon are written over these once the app
    boots - see lib/core/branding/document_branding.dart. These are what
    is true before that: on the first paint, in a bookmark made too
    early, and for anything that reads the page without running it.

    They used to say "Yoked Church", which is the demo church rather than
    the product, so every church's tab opened with somebody else's name.
  -->
  <meta name="description" content="Yoked - a website, a member app, and the tools to run a Sunday. Set it up yourself in a few minutes.">
  <meta name="theme-color" content="#1B3A4B">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Yoked">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!--
    What a link to this site looks like when somebody pastes it into
    Facebook, WhatsApp, iMessage, Slack or a group text. Without these it
    renders as a bare URL - no title, no description, no picture - which
    is a poor first impression for a product whose whole pitch is "send
    people this link".

    Product-level, and it cannot be otherwise here. The app routes on the
    URL fragment and browsers never send a fragment to the server, so a
    crawler fetching a church's address only ever receives this one file
    and has no way to learn which church was meant. Per-church previews
    would need server-side rendering, which GitHub Pages does not do.

    og:image must be an absolute URL - crawlers do not resolve <base> -
    so it is pinned to the deployed site rather than left relative.
    A fork on another host needs this line changed.
    web/social-card.png is generated by web/tools/build_social_card.mjs.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Yoked">
  <meta property="og:title" content="Yoked - everything your church needs online">
  <meta property="og:description" content="A website, a member app, and the tools to run a Sunday - sermons, events, giving, groups, kids check-in, rotas. No code, nobody to call.">
  <meta property="og:image" content="https://natehale05-gif.github.io/Yoked-Church-Web-App/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Yoked - everything your church needs online.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Yoked - everything your church needs online">
  <meta name="twitter:description" content="A website, a member app, and the tools to run a Sunday - sermons, events, giving, groups, kids check-in, rotas. No code, nobody to call.">
  <meta name="twitter:image" content="https://natehale05-gif.github.io/Yoked-Church-Web-App/social-card.png">

  <title>Yoked</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The loading screen.
    ===================

    A phone fetches somewhere around 3.5MB before this app can draw
    anything: the Dart bundle, the CanvasKit renderer, the fonts. Until
    this existed, all of that happened behind a blank white page - and on
    a slow connection a blank white page is indistinguishable from a site
    that is broken. Somebody who has just been handed their church's
    address gives it a few seconds and decides it does not work.

    Deliberately plain CSS with no web font and no image, because it has
    to paint from the first HTML response rather than joining the queue
    it exists to cover. It says the product's name rather than the
    church's: which church this is lives in Dart, which has not loaded.

    `web/flutter_bootstrap.js` takes it down once Flutter's scene is
    actually on screen.
  -->
  <style>
    body { margin: 0; background: #1B3A4B; }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #1B3A4B;
      color: #F7F5F0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      opacity: 1;
      transition: opacity 220ms ease-out;
    }
    #loading.done { opacity: 0; pointer-events: none; }

    #loading .wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    #loading .mark {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: #C9A24B;
      color: #1B3A4B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 700;
    }

    /* A determinate-looking bar would be a lie - nothing here knows how
       far along the download is. This just says the page is alive. */
    #loading .bar {
      width: 168px;
      height: 3px;
      border-radius: 2px;
      background: rgba(247, 245, 240, 0.18);
      overflow: hidden;
    }
    #loading .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: #C9A24B;
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    #loading .hint { font-size: 13px; color: rgba(247, 245, 240, 0.6); }

    @media (prefers-reduced-motion: reduce) {
      #loading .bar::after { animation: none; width: 100%; opacity: 0.5; }
      #loading { transition: none; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="wordmark"><span class="mark">Y</span>Yoked</div>
    <div class="bar"></div>
    <div class="hint">Loading your church&rsquo;s site&hellip;</div>
  </div>

  <!--
    Customized in web/flutter_bootstrap.js, which is what removes the
    loading screen above once there is something behind it.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
