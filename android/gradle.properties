org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# file_picker 11.0.2 skips its own `kotlinOptions { jvmTarget = 17 }` when
# AGP is 9 or newer (see the note in build.gradle.kts), so its Kotlin can
# compile to a different bytecode target than the Java 17 its
# compileOptions ask for. Gradle treats that mismatch as an error by
# default; on Android both are dexed anyway, so a warning is the honest
# severity. Remove alongside the KGP workaround.
kotlin.jvm.target.validation.mode=warning
