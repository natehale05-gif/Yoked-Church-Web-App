<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yoked</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font: 500 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #616161;
      background: #f1f1f1;
    }
    main { max-width: 32rem; padding: 2rem; text-align: center; }
  </style>
  <script>
    // Every church has an address, and the whole pitch is that a church
    // can hand it out - print it on a card, read it out from the front.
    // That address is now a real path:
    //
    //     .../Yoked-Church-Web-App/c/grace-chapel/admin
    //
    // GitHub Pages has no server-side rewrites and no file at that path,
    // so it serves this page instead. Handing the request back to the
    // app is the only place that can be fixed, and it is the difference
    // between a printed address working and not.
    //
    // The Flutter build solved the same problem by rewriting the path
    // into a `#` fragment, because that is what it routed on. Nothing
    // routes on the fragment any more, so the path is put back as a real
    // path and the address bar ends up showing what the visitor typed.
    (function () {
      // How much of the path belongs to the site rather than the route.
      //
      // One, because this deploys to a GitHub *project* page, where the
      // site lives under /<repo>/ - and the build sets Vite's `base` to
      // match. A user or organisation page serves from the domain root
      // and would want 0. `src/app/pages-routing.test.ts` holds this and
      // the build's base in step.
      var PATH_SEGMENTS_IN_BASE = 1;

      var l = window.location;
      var segments = l.pathname.split('/').filter(function (s) { return s.length > 0; });

      var base = '/' + segments.slice(0, PATH_SEGMENTS_IN_BASE).join('/');
      if (base.length > 1) base += '/';

      var route = segments.slice(PATH_SEGMENTS_IN_BASE).join('/');

      // A miss on the base itself means index.html is genuinely absent -
      // a broken deploy, not a mistyped address. Redirecting would loop.
      if (route.length === 0 && !l.search) return;

      // Handed over in sessionStorage rather than in the URL, so the
      // address bar never shows the `/?/c/grace-chapel` form that the
      // query-string version of this trick leaves behind. index.html
      // puts it back with `history.replaceState` before the router
      // reads the location.
      try {
        sessionStorage.setItem('yoked:redirect', '/' + route + l.search + l.hash);
      } catch (e) {
        // Private mode with storage disabled. Fall back to the query
        // form, which is uglier but does not need storage at all.
        l.replace(l.protocol + '//' + l.host + base + '?redirect=/' + route);
        return;
      }

      // `replace` rather than `assign` so the back button goes where the
      // visitor came from, not back to a page that only ever redirects.
      l.replace(l.protocol + '//' + l.host + base);
    })();
  </script>
</head>
<body>
  <main>
    <p>Taking you to the app&hellip;</p>
    <noscript>
      <p>This site needs JavaScript. Once it is enabled this address will
      work; in the meantime the site itself is still reachable.</p>
    </noscript>
  </main>
</body>
</html>
